<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Build gets faster with AI agents</title>
  <desc id="desc">Before agents, Build takes the largest part of a delivery cycle. With AI agents, Build is shorter while the other stages remain, leaving free time on the right.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111d35"/>
      <stop offset="1" stop-color="#081321"/>
    </linearGradient>
    <pattern id="free" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#36d1dc" stroke-width="4" opacity=".25"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="1180" height="540" rx="36" fill="url(#panel)" stroke="#26415f" stroke-width="2"/>

  <g font-family="Nunito, Arial, sans-serif">
    <text x="70" y="72" fill="#aebbd0" font-size="24" font-weight="900" letter-spacing="2">BEFORE AGENTS</text>
    <g transform="translate(70 96)" font-size="22" font-weight="900" text-anchor="middle" fill="#f5f8ff">
      <g><rect width="120" height="112" rx="20" fill="#32245d" stroke="#a78bfa" stroke-width="3"/><text x="60" y="66">Plan</text></g>
      <g transform="translate(130)"><rect width="120" height="112" rx="20" fill="#143d50" stroke="#36d1dc" stroke-width="3"/><text x="60" y="66">Design</text></g>
      <g transform="translate(260)"><rect width="320" height="112" rx="20" fill="#563020" stroke="#ff8a3d" stroke-width="4"/><text x="160" y="58" font-size="28">Build</text><text x="160" y="84" fill="#ffc19a" font-size="16">most of the cycle</text></g>
      <g transform="translate(590)"><rect width="120" height="112" rx="20" fill="#32245d" stroke="#a78bfa" stroke-width="3"/><text x="60" y="66">Test</text></g>
      <g transform="translate(720)"><rect width="120" height="112" rx="20" fill="#143d50" stroke="#36d1dc" stroke-width="3"/><text x="60" y="66">Deploy</text></g>
      <g transform="translate(850)"><rect width="140" height="112" rx="20" fill="#32245d" stroke="#a78bfa" stroke-width="3"/><text x="70" y="66">Maintain</text></g>
    </g>

    <text x="70" y="286" fill="#f5f8ff" font-size="24" font-weight="900" letter-spacing="2">WITH AI AGENTS</text>
    <g transform="translate(70 310)" font-size="22" font-weight="900" text-anchor="middle" fill="#f5f8ff">
      <g><rect width="120" height="112" rx="20" fill="#32245d" stroke="#a78bfa" stroke-width="3"/><text x="60" y="66">Plan</text></g>
      <g transform="translate(130)"><rect width="120" height="112" rx="20" fill="#143d50" stroke="#36d1dc" stroke-width="3"/><text x="60" y="66">Design</text></g>
      <g transform="translate(260)"><rect width="70" height="112" rx="20" fill="#563020" stroke="#ff8a3d" stroke-width="4"/><text x="35" y="66" font-size="17">Build</text></g>
      <g transform="translate(340)"><rect width="120" height="112" rx="20" fill="#32245d" stroke="#a78bfa" stroke-width="3"/><text x="60" y="66">Test</text></g>
      <g transform="translate(470)"><rect width="120" height="112" rx="20" fill="#143d50" stroke="#36d1dc" stroke-width="3"/><text x="60" y="66">Deploy</text></g>
      <g transform="translate(600)"><rect width="140" height="112" rx="20" fill="#32245d" stroke="#a78bfa" stroke-width="3"/><text x="70" y="66">Maintain</text></g>
      <g transform="translate(800)"><rect width="250" height="112" rx="20" fill="url(#free)" stroke="#36d1dc" stroke-width="2" stroke-dasharray="8 8"/><text x="125" y="44" fill="#7ce3ed">Freed time</text><text x="125" y="70" fill="#aebbd0" font-size="16">for decisions</text><text x="125" y="91" fill="#aebbd0" font-size="16">and checks</text></g>
    </g>

    <text x="70" y="480" fill="#f5f8ff" font-size="28" font-weight="900">Build gets faster. Decisions and checks still take time.</text>
    <text x="1130" y="516" text-anchor="end" fill="#7f8da5" font-size="18" font-weight="700">Illustrative, not to scale</text>
  </g>
</svg>
