<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The bottleneck moved</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;

  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(820px,100% - 32px);margin:64px auto 96px}

4.7L409.4 215.9M378.3 200.7L378.3 201.9"/></g></g><g data-part="build-control-pointer"><path class="iso-line" data-tone="hi" d="M395.5 206.8L392.2 208.4"/></g><g data-part="build-control-knob" class="speed-knob"><g class="iso-solid"><path class="iso-fill" d="M385.5 203.2L385.7 202.7L386.4 202.3L392.1 199.5L393.1 199.2L394.1 199.1L395.2 199.2L396 199.5L401.4 202.5L402 203L402.2 203.5L402.2 209L401.9 209.6L401.3 210L395.5 212.8L394.6 213.1L393.5 213.2L392.5 213L391.6 212.7L386.2 209.7L385.7 209.3L385.5 208.7Z"/><path class="iso-shade" data-shade="0" d="M402.2 209L401.9 209.6L401.9 204.1L402.2 203.5ZM401.9 209.6L401.3 210L401.3 204.5L401.9 204.1ZM401.3 210L395.5 212.8L395.5 207.3L401.3 204.5ZM395.5 212.8L394.6 213.1L394.6 207.6L395.5 207.3Z"/><path class="iso-shade" data-shade="1" d="M394.6 213.1L393.5 213.2L393.5 207.7L394.6 207.6Z"/><path class="iso-shade" data-shade="2" d="M393.5 213.2L392.5 213L392.5 207.6L393.5 207.7Z"/><path class="iso-shade" data-shade="3" d="M392.5 213L391.6 212.7L391.6 207.2L392.5 207.6ZM391.6 212.7L386.2 209.7L386.2 204.3L391.6 207.2ZM386.2 209.7L385.7 209.3L385.7 203.8L386.2 204.3ZM385.7 209.3L385.5 208.7L385.5 203.2L385.7 203.8Z"/><path class="iso-top" d="M401.4 202.5L402 203L402.2 203.5L401.9 204.1L401.3 204.5L395.5 207.3L394.6 207.6L393.5 207.7L392.5 207.6L391.6 207.2L386.2 204.3L385.7 203.8L385.5 203.2L385.7 202.7L386.4 202.3L392.1 199.5L393.1 199.2L394.1 199.1L395.2 199.2L396 199.5Z"/><path class="iso-line iso-crease" data-tone="faint" d="M402.2 203.5L401.9 204.1L401.3 204.5L395.5 207.3L394.6 207.6L393.5 207.7L392.5 207.6L391.6 207.2L386.2 204.3L385.7 203.8L385.5 203.2"/><path class="iso-line iso-bevel" data-tone="faint" d="M402.2 203.5L400.9 203.8L400.5 204.2L394.8 206.9L394.2 207.1L393.6 207.1L392.9 207.1L392.3 206.8L387.1 203.9L386.7 203.6L385.5 203.2"/><path class="iso-line iso-edge" data-tone="hi" d="M385.5 203.2L385.7 202.7L386.4 202.3L392.1 199.5L393.1 199.2L394.1 199.1L395.2 199.2L396 199.5L401.4 202.5L402 203L402.2 203.5M402.2 209L401.9 209.6L401.3 210L395.5 212.8L394.6 213.1L393.5 213.2L392.5 213L391.6 212.7L386.2 209.7L385.7 209.3L385.5 208.7M402.2 203.5L402.2 209M385.5 203.2L385.5 208.7"/></g><path class="iso-line" data-tone="lo" d="M398.8 202.9L399.1 203.2L399.2 203.5L399.1 203.8L398.7 204L394.7 206L394.2 206.1L393.6 206.2L393.1 206.1L392.6 205.9L388.8 203.9L388.5 203.6L388.4 203.3L388.6 203L388.9 202.7L392.9 200.8L393.4 200.7L394 200.6L394.6 200.7L395.1 200.9Z"/></g></svg></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Build speed control and the active constraint</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Six physical stations from Plan to Maintain</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>Queue cards after one illustrative hour</span></span><span class="iso-caption">Illustrative model. Six stations process work for one hour. Increase Build from 50% to 150%. Build clears its own queue, but Deploy can process only 2.6 items per hour, so the largest queue moves downstream.</span></figcaption></figure></main><script type="module">
const ARRIVAL_RATE=3.2;
const ILLUSTRATIVE=true;
const SPEED_RANGE={"min":0.5,"max":1.5,"step":0.1};
const STATIONS=[{"id":"plan","name":"Plan","capacity":4.2,"startQueue":0.3},{"id":"design","name":"Design","capacity":4,"startQueue":0.3},{"id":"build","name":"Build","capacity":4.8,"startQueue":4,"controlled":true},{"id":"test","name":"Test","capacity":6,"startQueue":0},{"id":"deploy","name":"Deploy","capacity":2.6,"startQueue":0.4},{"id":"maintain","name":"Maintain","capacity":3.8,"startQueue":0.5}];
const CONTROL_TRAVEL=28;
const KNOB_UNIT=[1.038512325239708,0.5735814859330617];
const clampSpeed=(speed) => {
  const numeric = Number(speed);
  const value = Number.isFinite(numeric) ? numeric : 1;
  return Math.min(SPEED_RANGE.max, Math.max(SPEED_RANGE.min, value));
};
const simulate=function simulate(speed = 1) {
  const buildSpeed = clampSpeed(speed);
  let incoming = ARRIVAL_RATE;
  const stations = STATIONS.map((station) => {
    const capacity = station.capacity * (station.controlled ? buildSpeed : 1);
    const available = incoming + station.startQueue;
    const processed = Math.min(available, capacity);
    const queue = Math.max(0, available - processed);
    const result = { ...station, incoming, capacity, available, processed, queue };
    incoming = processed;
    return result;
  });
  const bottleneck = stations.reduce((worst, station) =>
    station.queue > worst.queue ? station : worst, stations[0]);
  return { illustrative: ILLUSTRATIVE, hours: 1, speed: buildSpeed, arrival: ARRIVAL_RATE, stations, bottleneck };
};
const readoutOf=function readoutOf(result) {
  const build = result.stations.find((station) => station.id === 'build');
  return `Build ${Math.round(result.speed * 100)}% · ${build.processed.toFixed(1)}/h · ${result.bottleneck.name} queue ${result.bottleneck.queue.toFixed(1)} after 1 h`;
};
const stationSummary=function stationSummary(result) {
  return result.stations.map((station) => ({
    id: station.id,
    name: station.name,
    processed: Number(station.processed.toFixed(2)),
    queue: Number(station.queue.toFixed(2)),
    bottleneck: station.id === result.bottleneck.id,
  }));
};
const stage=document.querySelector('.iso-stage')||document.documentElement;
const svg=stage.matches('svg')?stage:stage.querySelector('svg');
const readouts=[document.querySelector('[data-readout]'),svg.querySelector('[data-svg-readout]')].filter(Boolean);
const still=matchMedia('(prefers-reduced-motion: reduce)');
const clamp=(value,low,high)=>Math.min(high,Math.max(low,value));
let value=1,target=value,frame=0,last=0,clock=0,visible=false,touring=!still.matches,idleTimer=0;
const paint=()=>{
  const result=simulate(value);
  const summary=stationSummary(result);
  summary.forEach((station,index)=>{
    const root=svg.querySelector('[data-station="'+station.id+'"]');
    if(root)root.dataset.bottleneck=String(station.bottleneck);
    svg.querySelectorAll('[data-station-index="'+index+'"][data-level]').forEach((card)=>{
      const level=Number(card.dataset.level);
      const share=clamp(station.queue-level,0,1);
      card.style.opacity=String(.08+.92*share);
    });
  });
  const knob=svg.querySelector('.speed-knob');
  const offset=(value-1)*CONTROL_TRAVEL;
  knob.setAttribute('transform','translate('+(KNOB_UNIT[0]*offset).toFixed(2)+' '+(KNOB_UNIT[1]*offset).toFixed(2)+')');
  const text=readoutOf(result);
  readouts.forEach((node)=>node.textContent=text);
  stage.setAttribute('aria-valuenow',String(Math.round(value*100)));
  stage.setAttribute('aria-valuetext',text+'. Values are illustrative.');
};
const tourAt=(time)=>[.5,1,1.5,1][Math.floor(time/3.2)%4];
const tick=(now)=>{
  const dt=last?Math.min((now-last)/1000,1/30):1/60;last=now;
  if(touring){clock+=dt;target=tourAt(clock)}
  value=still.matches?target:value+(target-value)*(1-Math.exp(-dt/.34));
  if(Math.abs(target-value)<.001)value=target;
  paint();
  const settled=!touring&&value===target;
  frame=visible&&!settled?requestAnimationFrame(tick):0;
};
const run=()=>{if(!frame&&visible){last=0;frame=requestAnimationFrame(tick)}};
const steer=(next)=>{
  touring=false;target=clampSpeed(next);clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{touring=!still.matches;clock=0;run()},3600);run();
};
new IntersectionObserver((entries)=>{visible=entries[entries.length-1].isIntersecting;if(visible)run()}, {rootMargin:'120px 0px'}).observe(stage);
stage.addEventListener('pointermove',(event)=>{
  const box=svg.getBoundingClientRect();
  const share=clamp((event.clientX-box.left)/box.width,0,1);
  steer(SPEED_RANGE.min+share*(SPEED_RANGE.max-SPEED_RANGE.min));
});
stage.addEventListener('pointerdown',(event)=>{stage.setPointerCapture?.(event.pointerId)});
stage.addEventListener('pointerup',(event)=>{stage.releasePointerCapture?.(event.pointerId)});
stage.addEventListener('pointercancel',(event)=>{stage.releasePointerCapture?.(event.pointerId)});
stage.addEventListener('keydown',(event)=>{
  let next=null;
  if(event.key==='ArrowRight'||event.key==='ArrowUp')next=target+SPEED_RANGE.step*(event.shiftKey?5:1);
  if(event.key==='ArrowLeft'||event.key==='ArrowDown')next=target-SPEED_RANGE.step*(event.shiftKey?5:1);
  if(event.key==='Home')next=SPEED_RANGE.min;
  if(event.key==='End')next=SPEED_RANGE.max;
  if(event.key==='Escape'){touring=false;target=value}
  if(next===null)return;event.preventDefault();steer(next);
});
stage.addEventListener('focus',()=>{touring=false;target=value;paint()});
still.addEventListener?.('change',()=>{touring=!still.matches;if(still.matches){value=target;paint()}run()});
paint();
</script></body></html>
