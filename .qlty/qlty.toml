config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "hadolint"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-iac"
mode = "monitor"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

# Debian package versions follow the selected base image.
[[ignore]]
rules = ["hadolint:DL3008"]
file_patterns = ["Dockerfile", "infra/Dockerfile"]

# Dockerfile style rules that would only reshuffle already-readable RUN lines.
[[ignore]]
rules = ["radarlint-iac:docker:S7031", "radarlint-iac:docker:S7020", "radarlint-iac:docker:S7018", "radarlint-iac:docker:S7019"]
file_patterns = ["Dockerfile", "infra/Dockerfile"]

# CDPATH= cd -- is the idiomatic POSIX pattern, not a broken assignment.
[[ignore]]
rules = ["shellcheck:1007"]
file_patterns = ["scripts/run.sh"]

# The imported upstream hook uses the same CDPATH= cd -- idiom as scripts/run.sh.
[[ignore]]
rules = ["shellcheck:1007"]
file_patterns = ["training-lab/upstream/aetherlink-agent-lab/scenarios/agent-menu/first-hook/protect-output.sh"]
