<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="960" height="48" fill="url(#hdr)" rx="8"/>
  <rect x="0" y="40" width="960" height="8" fill="url(#hdr)"/>
  <text x="480" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Customize stack · CLAUDE.md → skills → subagents → MCP/hooks</text>

  <!-- Session -->
  <rect x="24" y="78" width="120" height="70" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="84" y="106" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">Session</text>
  <text x="84" y="126" fill="#64748b" font-size="10" text-anchor="middle">fresh Claude</text>
  <line x1="144" y1="113" x2="178" y2="113" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- CLAUDE.md -->
  <rect x="180" y="68" width="150" height="90" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="255" y="96" fill="#166534" font-size="13" font-weight="700" text-anchor="middle">CLAUDE.md</text>
  <text x="255" y="116" fill="#166534" font-size="11" text-anchor="middle">Standing rules</text>
  <text x="255" y="136" fill="#64748b" font-size="10" text-anchor="middle">no oral re-brief</text>
  <line x1="330" y1="113" x2="362" y2="113" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Skills -->
  <rect x="364" y="68" width="150" height="90" rx="8" fill="#fff8f0" stroke="#d97706" stroke-width="2"/>
  <text x="439" y="96" fill="#92400e" font-size="13" font-weight="700" text-anchor="middle">skills</text>
  <text x="439" y="116" fill="#92400e" font-size="11" text-anchor="middle">Reusable method</text>
  <text x="439" y="136" fill="#64748b" font-size="10" text-anchor="middle">.claude/skills/…</text>
  <line x1="514" y1="113" x2="546" y2="113" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Subagents -->
  <rect x="548" y="68" width="150" height="90" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="623" y="96" fill="#5b21b6" font-size="13" font-weight="700" text-anchor="middle">subagents</text>
  <text x="623" y="116" fill="#5b21b6" font-size="11" text-anchor="middle">Bounded roles</text>
  <text x="623" y="136" fill="#64748b" font-size="10" text-anchor="middle">specialist runs</text>
  <line x1="698" y1="113" x2="730" y2="113" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- MCP / hooks -->
  <rect x="732" y="68" width="204" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="834" y="96" fill="#1e40af" font-size="13" font-weight="700" text-anchor="middle">MCP / hooks</text>
  <text x="834" y="116" fill="#1e40af" font-size="11" text-anchor="middle">Read-only context</text>
  <text x="834" y="136" fill="#64748b" font-size="10" text-anchor="middle">gates · no silent write</text>

  <!-- Stack annotation -->
  <path d="M 255 158 L 255 190 L 834 190 L 834 168" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-blue)"/>
  <text x="545" y="184" fill="#2563eb" font-size="11" font-weight="600" text-anchor="middle">Agent Capability Map · smallest useful team workflow</text>

  <!-- Capability map -->
  <rect x="24" y="220" width="912" height="78" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="246" fill="#1e3a5f" font-size="13" font-weight="700">Capability map (what each layer owns)</text>
  <text x="40" y="268" fill="#475569" font-size="12">CLAUDE.md = always-on rules · skill = repeatable method · subagent = scoped specialist · MCP = authorized read · hooks = stop/allow gates</text>
  <text x="40" y="288" fill="#64748b" font-size="11">Human checkpoint before write or any external action. Deck may lack subagent/hooks slides — narrative + sim still teach them.</text>

  <!-- Pedagogy -->
  <rect x="24" y="318" width="450" height="138" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="344" fill="#1e3a5f" font-size="13" font-weight="700">How each block works</text>
  <text x="40" y="366" fill="#475569" font-size="12">Explain → Demo → Your turn on Classroom 2.</text>
  <text x="40" y="386" fill="#475569" font-size="12">Practise in A6–A13 and mission CLASSROOM-02.</text>
  <text x="40" y="406" fill="#64748b" font-size="11">The stack builds on your assignments.</text>
  <text x="40" y="426" fill="#64748b" font-size="11">ConceptSim steps the stack without API keys.</text>

  <rect x="494" y="318" width="442" height="138" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="510" y="344" fill="#5b21b6" font-size="13" font-weight="700">Smallest useful workflow</text>
  <text x="510" y="366" fill="#5b21b6" font-size="12">1. Write CLAUDE.md (≥3 standing rules)</text>
  <text x="510" y="386" fill="#5b21b6" font-size="12">2. Skill for the method you re-type</text>
  <text x="510" y="406" fill="#5b21b6" font-size="12">3. Subagent when a role should stay bounded</text>
  <text x="510" y="426" fill="#7c3aed" font-size="11">4. MCP read-only + hooks; human gate before write</text>
</svg>
