<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="960" height="48" fill="url(#hdr)" rx="8"/>
  <rect x="0" y="40" width="960" height="8" fill="url(#hdr)"/>
  <text x="480" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Claude Code loop · explore → plan → change → verify → commit</text>

  <!-- Repo -->
  <rect x="24" y="78" width="120" height="70" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="84" y="106" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">Repo</text>
  <text x="84" y="126" fill="#64748b" font-size="10" text-anchor="middle">Aether Library</text>
  <line x1="144" y1="113" x2="178" y2="113" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Explore -->
  <rect x="180" y="68" width="128" height="90" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="244" y="96" fill="#166534" font-size="13" font-weight="700" text-anchor="middle">1 · explore</text>
  <text x="244" y="116" fill="#166534" font-size="11" text-anchor="middle">Read · map files</text>
  <text x="244" y="136" fill="#64748b" font-size="10" text-anchor="middle">no edits yet</text>
  <line x1="308" y1="113" x2="340" y2="113" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Plan -->
  <rect x="342" y="68" width="128" height="90" rx="8" fill="#fff8f0" stroke="#d97706" stroke-width="2"/>
  <text x="406" y="96" fill="#92400e" font-size="13" font-weight="700" text-anchor="middle">2 · plan</text>
  <text x="406" y="116" fill="#92400e" font-size="11" text-anchor="middle">Smallest change</text>
  <text x="406" y="136" fill="#64748b" font-size="10" text-anchor="middle">approve first</text>
  <line x1="470" y1="113" x2="502" y2="113" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Change -->
  <rect x="504" y="68" width="128" height="90" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="568" y="96" fill="#5b21b6" font-size="13" font-weight="700" text-anchor="middle">3 · change</text>
  <text x="568" y="116" fill="#5b21b6" font-size="11" text-anchor="middle">One edit only</text>
  <text x="568" y="136" fill="#64748b" font-size="10" text-anchor="middle">Create / edit</text>
  <line x1="632" y1="113" x2="664" y2="113" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Verify -->
  <rect x="666" y="68" width="128" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="730" y="96" fill="#1e40af" font-size="13" font-weight="700" text-anchor="middle">4 · verify</text>
  <text x="730" y="116" fill="#1e40af" font-size="11" text-anchor="middle">Run real checks</text>
  <text x="730" y="136" fill="#64748b" font-size="10" text-anchor="middle">Test · evidence</text>
  <line x1="794" y1="113" x2="826" y2="113" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Commit -->
  <rect x="828" y="68" width="108" height="90" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="882" y="96" fill="#991b1b" font-size="13" font-weight="700" text-anchor="middle">5 · commit</text>
  <text x="882" y="116" fill="#991b1b" font-size="11" text-anchor="middle">Handoff</text>
  <text x="882" y="136" fill="#64748b" font-size="10" text-anchor="middle">review → ship</text>

  <!-- Mapping note -->
  <path d="M 244 158 L 244 190 L 882 190 L 882 168" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-blue)"/>
  <text x="560" y="184" fill="#2563eb" font-size="11" font-weight="600" text-anchor="middle">product cue maps Create→change · Test→verify · Handoff→commit</text>

  <!-- Human gates -->
  <rect x="24" y="220" width="912" height="78" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="246" fill="#1e3a5f" font-size="13" font-weight="700">Human gates (do not skip)</text>
  <text x="40" y="268" fill="#475569" font-size="12">Approve the plan before any file changes. Mark unknowns as OPEN. Review PASS / REVISE / OPEN with evidence before handoff.</text>
  <text x="40" y="288" fill="#64748b" font-size="11">Tokens · context · hallucinations are supporting beats — the loop is the mechanism.</text>

  <!-- Pedagogy -->
  <rect x="24" y="318" width="450" height="138" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="344" fill="#1e3a5f" font-size="13" font-weight="700">Pedagogy kept (Apple bar)</text>
  <text x="40" y="366" fill="#475569" font-size="12">Uitleg → Voordoen → Zelf doen on Classroom 1.</text>
  <text x="40" y="386" fill="#475569" font-size="12">Solos A1–A4 + mission CLASSROOM-01 stay.</text>
  <text x="40" y="406" fill="#64748b" font-size="11">Jessy/Cons TD1 = pedagogy SoT — diagram adds the cue.</text>
  <text x="40" y="426" fill="#64748b" font-size="11">ConceptSim steps the loop without API keys.</text>

  <rect x="494" y="318" width="442" height="138" rx="8" fill="#fff8f0" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="510" y="344" fill="#92400e" font-size="13" font-weight="700">Safe agent habit</text>
  <text x="510" y="366" fill="#78350f" font-size="12">1. explore — read only; cite file evidence</text>
  <text x="510" y="386" fill="#78350f" font-size="12">2. plan — smallest change; get approval</text>
  <text x="510" y="406" fill="#78350f" font-size="12">3–4. change → verify with a real command</text>
  <text x="510" y="426" fill="#a16207" font-size="11">5. commit / handoff: file · cmd · result · owner</text>
</svg>
