<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="900" height="460" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="900" height="48" fill="url(#hdr)" rx="8"/>
  <rect x="0" y="40" width="900" height="8" fill="url(#hdr)"/>
  <text x="450" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Agency ladder · L1 Switch → L2 Agent → L3 specialists</text>

  <!-- Ticket input -->
  <rect x="28" y="78" width="130" height="70" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="93" y="106" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">Ticket</text>
  <text x="93" y="126" fill="#64748b" font-size="10" text-anchor="middle">WL-1026 · fixture</text>

  <line x1="158" y1="113" x2="198" y2="113" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- L1 -->
  <rect x="200" y="68" width="210" height="90" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="305" y="94" fill="#166534" font-size="14" font-weight="700" text-anchor="middle">L1 · Switch (no LLM)</text>
  <text x="305" y="116" fill="#166534" font-size="11" text-anchor="middle">Rules / keywords → L / M / H</text>
  <text x="305" y="136" fill="#64748b" font-size="10" text-anchor="middle">n8n-triage-l1-switch.json</text>

  <line x1="410" y1="113" x2="448" y2="113" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- L2 -->
  <rect x="450" y="68" width="210" height="90" rx="8" fill="#fff8f0" stroke="#d97706" stroke-width="2"/>
  <text x="555" y="94" fill="#92400e" font-size="14" font-weight="700" text-anchor="middle">L2 · AI Agent + memory</text>
  <text x="555" y="116" fill="#92400e" font-size="11" text-anchor="middle">Proposes priority · human reviews</text>
  <text x="555" y="136" fill="#64748b" font-size="10" text-anchor="middle">n8n-triage-l2-agent-memory.json</text>

  <line x1="660" y1="113" x2="698" y2="113" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- L3 -->
  <rect x="700" y="58" width="172" height="110" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="786" y="84" fill="#5b21b6" font-size="14" font-weight="700" text-anchor="middle">L3 · Specialists</text>
  <text x="786" y="106" fill="#5b21b6" font-size="11" text-anchor="middle">Customer Reply</text>
  <text x="786" y="124" fill="#5b21b6" font-size="11" text-anchor="middle">+ Risk</text>
  <text x="786" y="146" fill="#64748b" font-size="10" text-anchor="middle">one human gate</text>

  <!-- Ladder rungs annotation -->
  <path d="M 305 158 L 305 190 L 786 190 L 786 168" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-blue)"/>
  <text x="545" y="184" fill="#2563eb" font-size="11" font-weight="600" text-anchor="middle">same tickets · more agency · same L/M/H labels</text>

  <!-- Priority outputs -->
  <rect x="28" y="220" width="844" height="78" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="44" y="246" fill="#1e3a5f" font-size="13" font-weight="700">Shared exit labels (do not invent new ones)</text>
  <rect x="44" y="258" width="90" height="28" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="89" y="277" fill="#166534" font-size="12" font-weight="700" text-anchor="middle">LOW</text>
  <rect x="150" y="258" width="110" height="28" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
  <text x="205" y="277" fill="#854d0e" font-size="12" font-weight="700" text-anchor="middle">MEDIUM</text>
  <rect x="276" y="258" width="90" height="28" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="321" y="277" fill="#991b1b" font-size="12" font-weight="700" text-anchor="middle">HIGH</text>
  <text x="400" y="277" fill="#64748b" font-size="12">Fixture tickets grade every level (gradeTriage).</text>

  <!-- Pedagogy + gate -->
  <rect x="28" y="318" width="420" height="118" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="44" y="344" fill="#1e3a5f" font-size="13" font-weight="700">How each block works</text>
  <text x="44" y="366" fill="#475569" font-size="12">Explain → Demo → Your turn on the Worldline deck.</text>
  <text x="44" y="386" fill="#475569" font-size="12">Solo bar = L2; L3 is stretch. Build with the starters.</text>
  <text x="44" y="406" fill="#64748b" font-size="11">L1 needs no credential; L2/L3 use your own chat model.</text>
  <text x="44" y="422" fill="#64748b" font-size="11">ConceptSim steps L1 → L2 → L3 without API keys.</text>

  <rect x="468" y="318" width="404" height="118" rx="8" fill="#fff8f0" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="484" y="344" fill="#92400e" font-size="13" font-weight="700">Human gate before customer-facing</text>
  <text x="484" y="366" fill="#78350f" font-size="12">1. L1 routes by Switch rules (no LLM)</text>
  <text x="484" y="386" fill="#78350f" font-size="12">2. L2 agent proposes; facilitator reviews</text>
  <text x="484" y="406" fill="#78350f" font-size="12">3. L3 Reply + Risk share one explicit gate</text>
  <text x="484" y="422" fill="#a16207" font-size="11">Never silent auto-send. Proof = export + rules + level.</text>
</svg>
