<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="900" height="420" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="900" height="48" fill="url(#hdr)" rx="8"/>
  <rect x="0" y="40" width="900" height="8" fill="url(#hdr)"/>
  <text x="450" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Ticket → tool_use → priority (same labels as n8n)</text>

  <!-- Ticket -->
  <rect x="28" y="90" width="140" height="80" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="98" y="118" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">Ticket</text>
  <text x="98" y="138" fill="#64748b" font-size="10" text-anchor="middle">WL-1026 · message</text>
  <text x="98" y="154" fill="#64748b" font-size="10" text-anchor="middle">fixtures/*.json</text>

  <line x1="168" y1="130" x2="198" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Agent loop / messages -->
  <rect x="200" y="90" width="150" height="80" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="275" y="118" fill="#334155" font-size="13" font-weight="700" text-anchor="middle">messages[]</text>
  <text x="275" y="138" fill="#64748b" font-size="10" text-anchor="middle">systemPrompt + prompt</text>
  <text x="275" y="154" fill="#64748b" font-size="10" text-anchor="middle">s01 agent loop</text>

  <line x1="350" y1="130" x2="380" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- tool_use -->
  <rect x="382" y="78" width="160" height="104" rx="8" fill="#fff8f0" stroke="#d97706" stroke-width="2"/>
  <text x="462" y="106" fill="#92400e" font-size="13" font-weight="700" text-anchor="middle">tool_use</text>
  <text x="462" y="126" fill="#92400e" font-size="10" text-anchor="middle">TOOL_HANDLERS</text>
  <text x="462" y="144" fill="#92400e" font-size="10" text-anchor="middle">keyword_priority /</text>
  <text x="462" y="160" fill="#92400e" font-size="10" text-anchor="middle">classify_ticket</text>

  <line x1="542" y1="130" x2="572" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- tool_result -->
  <rect x="574" y="90" width="130" height="80" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="639" y="118" fill="#334155" font-size="13" font-weight="700" text-anchor="middle">tool_result</text>
  <text x="639" y="138" fill="#64748b" font-size="10" text-anchor="middle">signals + rule hit</text>
  <text x="639" y="154" fill="#64748b" font-size="10" text-anchor="middle">s02 dispatch</text>

  <line x1="704" y1="130" x2="734" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Priority -->
  <rect x="736" y="78" width="140" height="104" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="806" y="106" fill="#166534" font-size="13" font-weight="700" text-anchor="middle">Priority</text>
  <text x="806" y="126" fill="#166534" font-size="10" text-anchor="middle">low · medium · high</text>
  <rect x="756" y="140" width="100" height="28" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
  <text x="806" y="158" fill="#166534" font-size="11" font-weight="700" text-anchor="middle">HIGH</text>

  <!-- Loop back -->
  <path d="M 806 182 L 806 230 L 275 230 L 275 170" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-blue)"/>
  <text x="540" y="222" fill="#2563eb" font-size="11" font-weight="600" text-anchor="middle">while tool_use → keep looping (s01)</text>

  <!-- Human gate -->
  <rect x="28" y="260" width="410" height="130" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="44" y="286" fill="#1e3a5f" font-size="13" font-weight="700">Same acceptance as Workshop 3</text>
  <text x="44" y="308" fill="#475569" font-size="12">Fixture tickets + labels do not move — Claude must match n8n.</text>
  <text x="44" y="328" fill="#475569" font-size="12">Mismatch → fix prompt or tools, never invent a new label.</text>
  <text x="44" y="348" fill="#475569" font-size="12">Offline dry-run proves the chain; it is not model proof.</text>
  <text x="44" y="368" fill="#64748b" font-size="11">Keep Uitleg → Voordoen → Zelf doen · SOLO 0–4.</text>

  <rect x="462" y="260" width="416" height="130" rx="8" fill="#fff8f0" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="478" y="286" fill="#92400e" font-size="13" font-weight="700">Human gate before accept</text>
  <text x="478" y="308" fill="#78350f" font-size="12">1. Agent proposes priority from tool_result</text>
  <text x="478" y="328" fill="#78350f" font-size="12">2. Facilitator / peer reviews before accept</text>
  <text x="478" y="348" fill="#78350f" font-size="12">3. Acceptance table: ticket → n8n → Claude</text>
  <text x="478" y="368" fill="#a16207" font-size="11">ConceptSim steps ticket → tool_use → priority (no API key).</text>
</svg>
