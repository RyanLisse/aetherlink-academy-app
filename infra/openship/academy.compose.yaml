# The one Academy, deployed by OpenShip as a services project
# (composePath = infra/openship/academy.compose.yaml, see academy.project.json).
# OpenShip names the containers openship-<slug>-<service> and puts them on the
# project network openship-<slug>, where the app reaches postgres and redis by
# service name. The app keeps TLS to both, as in production today: the
# certificates are generated on the host by infra/deploy/init-tls.sh into
# /root/aetherlink-academy-openship/tls and bind-mounted read-only.
# Secrets are OpenShip project env vars (upserted by step.sh), never values in
# this file. OpenShip does NOT interpolate dollar-brace refs inside compose
# environment values for this stack — putting DATABASE_URL (or REDIS_URL /
# SOURCE_REVISION) on the app service with a dollar-brace same-key ref writes
# that literal into the container and shadows the resolved project-env secret
# (verified 2026-09-26, dep_DReiQCX0cz2xmlpk → ERR_INVALID_URL). Therefore
# those three keys are omitted from the app environment entirely so project
# env can inject the resolved values. Postgres keeps same-key
# ${POSTGRES_PASSWORD}. Redis must NOT put ${REDIS_PASSWORD} (or :? / :-) in
# command/commandArgv — OpenShip does not reliably expand those argv slots
# (verified 2026-09-26 → literal requirepass / WRONGPASS). Redis uses
# `sh -c` + shell "$REDIS_PASSWORD" with same-key env REDIS_PASSWORD +
# REDISCLI_AUTH. Prefer no bash :? / :- in any compose value (same class as
# the ports ParseAddr bug). See infra/openship/RESEARCH.md.
services:
  app:
    build:
      # Repo-root context. OpenShip resolves build against the linked repository
      # root (not the compose file dir); `../..` drifted and previously escaped
      # the repo. Live working service record uses `.`.
      context: .
      dockerfile: Dockerfile
    environment:
      ACADEMY_STORAGE: postgres
      HOST: 0.0.0.0
      PORT: "4317"
      ACADEMY_DATA: /data
      NODE_EXTRA_CA_CERTS: /tls/ca.crt
    # Hardcoded cutover publish. OpenShip's compose interpolator + Docker
    # PortBindings must not see bash `${VAR:-host:port}` here: a colon inside the
    # default truncates HostIp and Docker ParseAddr fails
    # (ParseAddr("${ACADEMY_PORT_BIND:-127.0.0.1")…). academy-app is stopped; bind live :4317.
    ports:
      - "0.0.0.0:4317:4317"
    volumes:
      - data:/data
      - /root/aetherlink-academy-openship/tls:/tls:ro
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    stop_grace_period: 30s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: academy
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/postgres.crt
      - -c
      - ssl_key_file=/tls/postgres.key
      - -c
      - hba_file=/tls/pg_hba.conf
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /root/aetherlink-academy-openship/tls:/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d academy"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # OpenShip does not expand ${REDIS_PASSWORD} in command/commandArgv (literal
    # requirepass → WRONGPASS). Shell expands "$REDIS_PASSWORD" from same-key
    # service env (environment templates re-resolve; never :? / :- here).
    command:
      - sh
      - -c
      - 'exec redis-server --save "" --appendonly no --port 0 --tls-port 6379 --tls-cert-file /tls/redis.crt --tls-key-file /tls/redis.key --tls-ca-cert-file /tls/ca.crt --tls-auth-clients no --requirepass "$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - /root/aetherlink-academy-openship/tls:/tls:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cacert", "/tls/ca.crt", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  data:
  pgdata:
