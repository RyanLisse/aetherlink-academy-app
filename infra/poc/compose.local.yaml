name: academy-authoring-poc
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: academy_poc
      POSTGRES_PASSWORD: ${POC_POSTGRES_PASSWORD:?Set POC_POSTGRES_PASSWORD}
      POSTGRES_DB: academy_poc
    ports: ["127.0.0.1:55540:5432"]
    volumes: ["poc-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy_poc -d academy_poc"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:55541:6379"]
volumes:
  poc-postgres:
