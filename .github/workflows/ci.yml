name: Academy CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.x'
  PNPM_VERSION: '11.19.0'

jobs:
  # This job intentionally has no dependency on tests so a build result is
  # still available when a behavioral test fails.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            vendor/proof-sdk/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir vendor/proof-sdk install --frozen-lockfile
      - run: pnpm --dir vendor/proof-sdk rebuild better-sqlite3 esbuild
      - run: pnpm --dir vendor/proof-sdk run build
      - run: pnpm run build

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            vendor/proof-sdk/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir vendor/proof-sdk install --frozen-lockfile
      - run: pnpm --dir vendor/proof-sdk rebuild better-sqlite3 esbuild
      - run: pnpm --dir vendor/proof-sdk run build
      - run: pnpm run build
      - name: Start TLS Postgres and Redis
        run: bash scripts/ci-services.sh start
      - name: Run serverless contract tests
        id: unit
        run: >-
          node --import ./vendor/proof-sdk/node_modules/tsx/dist/loader.mjs --test
          tests/room.test.mjs tests/remote-mcp.test.mjs tests/proof-stale-retry.test.mjs tests/suggestion-accept-persisted-retry.test.ts tests/runtime-config.test.mjs tests/browser-auth-boundary.test.mjs tests/headless-empty-document.test.ts tests/collab-marks-observer.test.ts tests/anchor-stability.test.ts
          tests/storage-actions.test.ts tests/storage-routes.test.mjs
          tests/google-sso.test.mjs tests/facilitator-sso-routes.test.mjs
          tests/agent-setup.test.mjs tests/five-day-content.test.mjs tests/day-packs-routes.test.mjs tests/lesson-route-day.test.mjs tests/solo-progress-day.test.mjs tests/learning-progress.test.mjs
      - name: Run storage against MinIO
        id: storage
        env:
          S3_BUCKET: academy-ci-storage
          S3_ENDPOINT: http://127.0.0.1:59000
          S3_ACCESS_KEY_ID: academy-ci
          S3_SECRET_ACCESS_KEY: academy-ci-storage-password
        run: |
          docker run --detach --name academy-ci-minio -p 127.0.0.1:59000:9000 \
            --env MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" --env MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          for i in $(seq 1 30); do
            if curl --fail --silent "$S3_ENDPOINT/minio/health/ready"; then
              break
            fi
            if [[ "$i" == 30 ]]; then
              echo 'MinIO did not become ready' >&2
              exit 1
            fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import {AwsClient} from 'aws4fetch';
          const client = new AwsClient({accessKeyId:process.env.S3_ACCESS_KEY_ID,secretAccessKey:process.env.S3_SECRET_ACCESS_KEY,service:'s3',region:'auto'});
          const response = await client.fetch(`${process.env.S3_ENDPOINT}/${process.env.S3_BUCKET}`,{method:'PUT'});
          if (!response.ok) throw new Error(`Bucket creation failed: ${response.status}`);
          JS
          node --import ./vendor/proof-sdk/node_modules/tsx/dist/loader.mjs --test tests/storage-s3.test.ts
      - name: Run Proof marks regressions
        id: marks
        working-directory: vendor/proof-sdk
        run: node --import tsx src/tests/marks.test.ts
      - name: Run Postgres and Redis contract tests
        id: database
        run: >-
          source "$RUNNER_TEMP/aetherlink-academy-ci/env.sh" &&
          ACADEMY_POSTGRES_TEST=1
          node --import ./vendor/proof-sdk/node_modules/tsx/dist/loader.mjs --test
          tests/postgres-store.test.mjs tests/facilitator-postgres.test.mjs tests/learning-postgres.test.mjs tests/presence.test.mjs
          tests/proof-postgres.test.mjs tests/proof-postgres-domain.test.mjs
          tests/canonical-postgres.test.ts tests/proof-snapshot.test.ts tests/proof-rest-rewrite.test.ts tests/proof-invalidation-race.test.ts tests/proof-reservation.test.mjs
          tests/request-retry.test.mjs tests/storage-postgres.test.ts
      - name: Run PostgreSQL suggestion anchor regression
        id: anchors
        timeout-minutes: 5
        run: |
          source "$RUNNER_TEMP/aetherlink-academy-ci/env.sh"
          node --import ./vendor/proof-sdk/node_modules/tsx/dist/loader.mjs vendor/proof-sdk/src/tests/suggestion-anchor-validation.test.ts
      - name: Start Academy for live single-process checks
        run: |
          source "$RUNNER_TEMP/aetherlink-academy-ci/env.sh"
          export ACADEMY_DATA=.data ACADEMY_PUBLIC_URL=http://127.0.0.1:4317
          node scripts/start.mjs > "$RUNNER_TEMP/academy-server.log" 2>&1 &
          printf '%s\n' "$!" > "$RUNNER_TEMP/academy-server.pid"
          for i in $(seq 1 60); do
            body=$(curl --silent --fail http://127.0.0.1:4317/game/health || true)
            if [[ "$body" == *'"proof":true'* ]]; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Run live Academy and Proof checks
        id: live
        env:
          ACADEMY_URL: http://127.0.0.1:4317
        run: >-
          node --import ./vendor/proof-sdk/node_modules/tsx/dist/loader.mjs --test
          tests/integration.test.mjs tests/collaboration.test.mjs
      - name: Run two-process distributed check
        id: distributed
        run: >-
          source "$RUNNER_TEMP/aetherlink-academy-ci/env.sh" &&
          ACADEMY_DISTRIBUTED_TEST=1 ACADEMY_TEST_LOG_DIR="$RUNNER_TEMP"
          node --import ./vendor/proof-sdk/node_modules/tsx/dist/loader.mjs --test
          tests/distributed.test.mjs
      - name: Show distributed process logs on failure
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/distributed-*.log; do
            [[ -f "$f" ]] || continue
            echo "===== $f"
            tail -n 200 "$f"
          done
      - name: Record check outcomes
        if: always()
        env:
          CHECK_RESULTS: ${{ toJSON(steps) }}
        run: |
          mkdir -p test-results
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const results = JSON.parse(process.env.CHECK_RESULTS);
          const checks = ['unit','storage','marks','database','anchors','live','distributed'].map(id => ({name:id,outcome:results[id]?.outcome || 'not-run'}));
          writeFileSync('test-results/ci-checks.json', JSON.stringify({revision:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,checks},null,2));
          JS
      - name: Upload check outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: academy-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ci-checks.json
          retention-days: 14
      - name: Stop Academy and CI services
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/academy-server.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/academy-server.pid")" 2>/dev/null || true
          fi
          docker rm --force academy-ci-minio >/dev/null 2>&1 || true
          bash scripts/ci-services.sh stop
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Start TLS Postgres and Redis
        run: bash scripts/ci-services.sh start
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.vercel
          tags: aetherlink-academy-vercel:${{ github.sha }}
          load: true
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
      - name: Capture image identity
        if: always()
        run: |
          docker image inspect aetherlink-academy-vercel:${{ github.sha }} \
            --format '{"imageId":{{json .Id}},"created":{{json .Created}},"tags":{{json .RepoTags}},"digests":{{json .RepoDigests}},"os":{{json .Os}},"architecture":{{json .Architecture}},"revision":{{json (index .Config.Labels "org.opencontainers.image.revision")}}}' \
            > "$RUNNER_TEMP/academy-image-identity.json" || true
      - name: Upload image identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: academy-image-identity-${{ github.sha }}
          path: ${{ runner.temp }}/academy-image-identity.json
          if-no-files-found: ignore
      - name: Start the actual Vercel container image
        run: |
          source "$RUNNER_TEMP/aetherlink-academy-ci/env.sh"
          docker run --detach --name academy-vercel-ci --network host \
            --volume "$RUNNER_TEMP/aetherlink-academy-ci/server.crt:/tmp/academy-ca.crt:ro" \
            --env NODE_EXTRA_CA_CERTS=/tmp/academy-ca.crt \
            --env DATABASE_URL="$DATABASE_URL" --env REDIS_URL="$REDIS_URL" \
            --env ACADEMY_STORAGE=postgres \
            --env ACADEMY_PUBLIC_URL=https://academy-ci.example.test \
            --env ACADEMY_HOST_KEY="$(openssl rand -hex 32)" \
            --env PROOF_COLLAB_SIGNING_SECRET="$(openssl rand -hex 32)" \
            --env VERCEL=1 \
            aetherlink-academy-vercel:${{ github.sha }}
          for i in $(seq 1 60); do
            body=$(curl --silent --fail http://127.0.0.1:4317/game/health || true)
            if jq --exit-status --arg revision "$GITHUB_SHA" ' .ok == true and .proof == true and .revision == $revision' <<< "$body" >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Check container health and restart readiness
        run: |
          for i in $(seq 1 30); do
            [[ "$(docker inspect --format '{{.State.Health.Status}}' academy-vercel-ci)" == healthy ]] && break
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' academy-vercel-ci)" = healthy
          docker restart academy-vercel-ci >/dev/null
          for i in $(seq 1 60); do
            body=$(curl --silent --fail http://127.0.0.1:4317/game/health || true)
            if jq --exit-status --arg revision "$GITHUB_SHA" ' .ok == true and .proof == true and .revision == $revision' <<< "$body" >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Stop container and CI services
        if: always()
        run: |
          docker rm --force academy-vercel-ci >/dev/null 2>&1 || true
          bash scripts/ci-services.sh stop
