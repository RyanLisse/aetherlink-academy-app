name: Academy CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.x'
  PNPM_VERSION: '11.19.0'

jobs:
  # This job intentionally has no dependency on tests so a build result is
  # still available when a behavioral test fails.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check every legacy test file runs in a workflow or is excluded with a reason
        run: node scripts/check-test-coverage.mjs

  participant-packages:
    name: Participant packages (Node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Package tests
        run: node --test training-lab/tests/w4-support-agent-sdk.test.mjs training-lab/tests/w3-n8n-triage.test.mjs
      - name: W4 install and offline lesson runs
        working-directory: training-lab/w4-support-agent-sdk
        run: |
          npm install --no-audit --no-fund
          npm run lesson1 -- MSG-01 --dry-run
          npm run lesson2 -- MSG-05 --dry-run
          npm run lesson3 -- MSG-08 --dry-run
          npm run smoke:mcp
      - name: W3 local n8n starts
        if: matrix.node == '24'
        working-directory: training-lab/w3-n8n-triage
        run: npm run n8n -- --version

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Start TLS Postgres and Redis
        run: bash scripts/ci-services.sh start
      - name: Run serverless contract tests
        id: unit
        run: >-
          node --import tsx --test
          tests/room.test.mjs tests/debrief-board.test.mjs tests/remote-mcp.test.mjs tests/screen-state-mcp.test.mjs tests/runtime-config.test.mjs tests/browser-auth-boundary.test.mjs
          tests/storage-actions.test.ts tests/storage-routes.test.mjs
          tests/google-sso.test.mjs tests/facilitator-sso-routes.test.mjs tests/native-apps-providers.test.mjs tests/openship-kit.test.mjs
          tests/participant-access.test.mjs tests/participant-access-routes.test.mjs tests/participant-access-ui.test.mjs tests/chat-embed.test.mjs
          tests/agent-setup.test.mjs tests/web-public-assets.test.mjs tests/seven-day-content.test.mjs tests/participant-copy.test.mjs tests/w4-solo-courses-static.test.mjs tests/w5-daily-brief-static.test.mjs tests/c1-c2-concepts-solo-static.test.mjs tests/n8n-triage-starters.test.mjs tests/day-packs-routes.test.mjs tests/lesson-route-day.test.mjs tests/solo-progress-day.test.mjs tests/learning-progress.test.mjs tests/migrate-v2.test.mjs tests/deployed-smoke.test.mjs tests/lab-embed-routes.test.mjs tests/day-pack-quiz.test.mjs tests/day3-progressive-n8n.test.mjs tests/w3-w4-instructions.test.mjs training-lab/tests/w4-support-agent-sdk.test.mjs training-lab/tests/w3-n8n-triage.test.mjs tests/proof-trail.test.mjs tests/lab-grading-routes.test.mjs tests/faq-chat.test.mjs tests/leercoach.test.mjs tests/naslag-release.test.mjs tests/cohort-access.test.mjs tests/cohort-routes.test.mjs tests/wave-cohort-chrome.test.mjs tests/debrief-board-chrome.test.mjs tests/autograde.test.mjs tests/certificate.test.mjs tests/course-order.test.mjs tests/legacy-redirect.test.mjs tests/email-otp.test.mjs tests/join-errors.test.mjs tests/verify-scripts.test.mjs tests/aet-122-en-default-paired-code.test.mjs tests/aet-82-access-codes-remaining.test.mjs tests/aet-83-wave1-chat-faq.test.mjs tests/i18n.test.mjs tests/aet-134-thin-ui.test.mjs tests/authoring-chrome.test.mjs
          tests/arcade-shell.test.mjs tests/badges.test.mjs tests/branding-chrome.test.mjs tests/classroom-mode.test.mjs tests/classroom-overlay-nav.test.mjs tests/classroom-overlay-pin.test.mjs tests/concept-sim.test.mjs tests/facilitator-chrome.test.mjs tests/lab-config-chrome.test.mjs tests/portal-identity.test.mjs tests/quiz-chrome.test.mjs tests/room-lab-control.test.mjs tests/teach-path-nav.test.mjs tests/web-spa-fallback.test.mjs
          tests/slides-actions.test.ts tests/slides-edits.test.ts tests/slides-routes.test.mjs tests/slides-classroom.test.ts tests/deck-assistant.test.mjs
          tests/solo-step-cards.test.mjs
      - name: Validate imported Learn Claude Code content
        run: node --test tests/content/learn-claude-code.test.mjs tests/content/learn-course-links.test.mjs
      - name: Run storage against MinIO
        id: storage
        env:
          S3_BUCKET: academy-ci-storage
          S3_ENDPOINT: http://127.0.0.1:59000
          S3_ACCESS_KEY_ID: academy-ci
          S3_SECRET_ACCESS_KEY: academy-ci-storage-password
        run: |
          # AIStor (quay.io/minio/aistor/minio) pulls anonymously but requires a
          # Free-tier license file before /minio/health/ready answers — not usable
          # in CI without baking a license. Official minio/minio + quay.io/minio/minio
          # anonymous pulls are gated (401). bitnamilegacy/minio is classic MinIO,
          # anonymously pullable on GH Actions, same health path + root creds.
          # Pin: tag 2025.7.23-debian-12-r5 (multi-arch list digest).
          docker run --detach --name academy-ci-minio -p 127.0.0.1:59000:9000 \
            --env MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" --env MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            bitnamilegacy/minio@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
          for i in $(seq 1 60); do
            if curl --fail --silent --max-time 2 "$S3_ENDPOINT/minio/health/ready"; then
              break
            fi
            if [[ "$i" == 60 ]]; then
              echo 'MinIO did not become ready' >&2
              echo '===== docker ps -a (academy-ci-minio) =====' >&2
              docker ps -a --filter name=academy-ci-minio >&2 || true
              echo '===== docker logs academy-ci-minio =====' >&2
              docker logs academy-ci-minio >&2 || true
              exit 1
            fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import {AwsClient} from 'aws4fetch';
          const client = new AwsClient({accessKeyId:process.env.S3_ACCESS_KEY_ID,secretAccessKey:process.env.S3_SECRET_ACCESS_KEY,service:'s3',region:'auto'});
          const response = await client.fetch(`${process.env.S3_ENDPOINT}/${process.env.S3_BUCKET}`,{method:'PUT'});
          if (!response.ok) throw new Error(`Bucket creation failed: ${response.status}`);
          JS
          node --import tsx --test tests/storage-s3.test.ts
      - name: Install Chromium for browser contract tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Arcade Lab embed browser test
        id: lab-embed
        run: node --import tsx --test tests/lab-embed-browser.test.mjs
      - name: Run legacy UI states and axe browser test
        id: legacy-ui
        run: node --import tsx --test tests/legacy-ui-browser.test.mjs
      - name: Run legacy layout sweep browser test
        id: legacy-layout
        run: node --import tsx --test tests/legacy-layout-sweep.test.mjs
      - name: Run Postgres and Redis contract tests
        id: database
        run: >-
          source "$RUNNER_TEMP/aetherlink-academy-ci/env.sh" &&
          ACADEMY_POSTGRES_TEST=1
          node --import tsx --test
          tests/postgres-store.test.mjs tests/participant-access.test.mjs tests/cohort-access.test.mjs tests/email-otp.test.mjs tests/certificate-postgres.test.mjs tests/facilitator-postgres.test.mjs tests/learning-postgres.test.mjs tests/presence.test.mjs tests/course-order.test.mjs
          tests/request-retry.test.mjs tests/storage-postgres.test.ts tests/proof-trail-postgres.test.mjs tests/leercoach-postgres.test.mjs
          tests/slides-postgres.test.ts
      - name: Run migrate-v2 apply against a throwaway database
        id: migrate
        run: |
          source "$RUNNER_TEMP/aetherlink-academy-ci/env.sh"
          ACADEMY_MIGRATE_PG_TEST=1 node --import tsx --test tests/migrate-v2.test.mjs
      - name: Start Academy for live single-process checks
        run: |
          source "$RUNNER_TEMP/aetherlink-academy-ci/env.sh"
          export ACADEMY_DATA=.data ACADEMY_PUBLIC_URL=http://127.0.0.1:4317
          node scripts/start.mjs > "$RUNNER_TEMP/academy-server.log" 2>&1 &
          printf '%s\n' "$!" > "$RUNNER_TEMP/academy-server.pid"
          for i in $(seq 1 60); do
            body=$(curl --silent --fail http://127.0.0.1:4317/game/health || true)
            if [[ "$body" == *'"ok":true'* ]]; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Run live Academy checks
        id: live
        env:
          ACADEMY_URL: http://127.0.0.1:4317
        run: >-
          node --import tsx --test
          tests/integration.test.mjs
      - name: Run two-process distributed check
        id: distributed
        run: >-
          source "$RUNNER_TEMP/aetherlink-academy-ci/env.sh" &&
          ACADEMY_DISTRIBUTED_TEST=1 ACADEMY_TEST_LOG_DIR="$RUNNER_TEMP"
          node --import tsx --test --test-concurrency=1
          tests/distributed.test.mjs
      - name: Show distributed process logs on failure
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/distributed-*.log; do
            [[ -f "$f" ]] || continue
            echo "===== $f"
            tail -n 200 "$f"
          done
      - name: Record check outcomes
        if: always()
        env:
          CHECK_RESULTS: ${{ toJSON(steps) }}
        run: |
          mkdir -p test-results
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const results = JSON.parse(process.env.CHECK_RESULTS);
          const checks = ['unit','storage','lab-embed','legacy-ui','legacy-layout','marks','database','anchors','live','distributed'].map(id => ({name:id,outcome:results[id]?.outcome || 'not-run'}));
          writeFileSync('test-results/ci-checks.json', JSON.stringify({revision:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,checks},null,2));
          JS
      - name: Upload check outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: academy-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ci-checks.json
          retention-days: 14
      - name: Stop Academy and CI services
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/academy-server.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/academy-server.pid")" 2>/dev/null || true
          fi
          docker rm --force academy-ci-minio >/dev/null 2>&1 || true
          bash scripts/ci-services.sh stop
  # Pixel baselines only hold inside the image that rendered them; refresh them
  # with `bash scripts/visual-baselines.sh` (see tests/visual/README.md).
  legacy-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:legacy
      - name: Compare legacy screenshots against committed baselines
        run: pnpm run test:visual:legacy
      - name: Upload visual diff report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legacy-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/legacy-visual
            test-results/legacy-visual
          retention-days: 14
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Start TLS Postgres and Redis
        run: bash scripts/ci-services.sh start
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          tags: aetherlink-academy:${{ github.sha }}
          load: true
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
      - name: Capture image identity
        if: always()
        run: |
          docker image inspect aetherlink-academy:${{ github.sha }} \
            --format '{"imageId":{{json .Id}},"created":{{json .Created}},"tags":{{json .RepoTags}},"digests":{{json .RepoDigests}},"os":{{json .Os}},"architecture":{{json .Architecture}},"revision":{{json (index .Config.Labels "org.opencontainers.image.revision")}}}' \
            > "$RUNNER_TEMP/academy-image-identity.json" || true
      - name: Upload image identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: academy-image-identity-${{ github.sha }}
          path: ${{ runner.temp }}/academy-image-identity.json
          if-no-files-found: ignore
      - name: Start the production container image
        run: |
          source "$RUNNER_TEMP/aetherlink-academy-ci/env.sh"
          docker run --detach --name academy-ci --network host \
            --volume "$RUNNER_TEMP/aetherlink-academy-ci/server.crt:/tmp/academy-ca.crt:ro" \
            --env NODE_EXTRA_CA_CERTS=/tmp/academy-ca.crt \
            --env DATABASE_URL="$DATABASE_URL" --env REDIS_URL="$REDIS_URL" \
            --env ACADEMY_STORAGE=postgres \
            --env ACADEMY_PUBLIC_URL=https://academy-ci.example.test \
            --env ACADEMY_HOST_KEY="$(openssl rand -hex 32)" \
            --env ACADEMY_SIGNING_SECRET="$(openssl rand -hex 32)" \
            --env VERCEL=1 \
            aetherlink-academy:${{ github.sha }}
          for i in $(seq 1 60); do
            body=$(curl --silent --fail http://127.0.0.1:4317/game/health || true)
            if jq --exit-status --arg revision "$GITHUB_SHA" ' .ok == true and .revision == $revision' <<< "$body" >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Check container health and restart readiness
        run: |
          for i in $(seq 1 30); do
            [[ "$(docker inspect --format '{{.State.Health.Status}}' academy-ci)" == healthy ]] && break
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' academy-ci)" = healthy
          docker restart academy-ci >/dev/null
          for i in $(seq 1 60); do
            body=$(curl --silent --fail http://127.0.0.1:4317/game/health || true)
            if jq --exit-status --arg revision "$GITHUB_SHA" ' .ok == true and .revision == $revision' <<< "$body" >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Stop container and CI services
        if: always()
        run: |
          docker rm --force academy-ci >/dev/null 2>&1 || true
          bash scripts/ci-services.sh stop
