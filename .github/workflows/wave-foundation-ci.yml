name: Wave foundation CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-foundation-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.x'
  PNPM_VERSION: '11.19.0'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build:workspace
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: wave-shell-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/playwright
          if-no-files-found: warn
          retention-days: 14

  services:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            vendor/proof-sdk/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir vendor/proof-sdk install --frozen-lockfile
      - run: pnpm --dir vendor/proof-sdk rebuild better-sqlite3 esbuild
      - name: Real Postgres/Redis outage and recovery with a live Proof child
        run: pnpm run test:services
      - name: Versioned curriculum on isolated PostgreSQL
        run: pnpm --filter @academy/server run test:curriculum-db
      - name: Full-text search and release gate on isolated PostgreSQL
        run: pnpm --filter @academy/server run test:search-db

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: infra/Dockerfile
          tags: aetherlink-academy-wave:${{ github.sha }}
          load: true
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
      - name: Prepare the Compose environment
        env:
          REVISION: ${{ github.sha }}
        run: |
          cp infra/.env.example infra/.env
          sed -i "s/^SOURCE_REVISION=.*/SOURCE_REVISION=$REVISION/" infra/.env
      - name: Start the same TLS Compose stack used locally
        run: docker compose --project-name academy-wave --file infra/compose.yaml --env-file infra/.env up --detach
      - name: Require a truthful /health with the built revision
        env:
          REVISION: ${{ github.sha }}
        run: |
          for i in $(seq 1 90); do
            body=$(curl --silent http://127.0.0.1:4318/health || true)
            if jq --exit-status --arg revision "$REVISION" '.ok == true and .proof == true and .revision == $revision' <<< "$body" >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "last body: $body"; docker compose --project-name academy-wave --file infra/compose.yaml --env-file infra/.env logs --tail 100 app proof; exit 1
      - name: Postgres outage is reported and recovers without restarting the container
        run: |
          docker compose --project-name academy-wave --file infra/compose.yaml --env-file infra/.env stop postgres
          for i in $(seq 1 20); do
            if jq --exit-status '.postgres.reachable == false' <<< "$(curl --silent http://127.0.0.1:4318/connection)" >/dev/null 2>&1; then break; fi; sleep 1
          done
          jq --exit-status '.postgres.reachable == false' <<< "$(curl --silent http://127.0.0.1:4318/connection)"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4318/health)" = 503
          docker compose --project-name academy-wave --file infra/compose.yaml --env-file infra/.env start postgres
          for i in $(seq 1 60); do
            if jq --exit-status '.ok == true and .proof == true' <<< "$(curl --silent http://127.0.0.1:4318/health)" >/dev/null 2>&1; then exit 0; fi; sleep 2
          done
          curl --silent http://127.0.0.1:4318/connection; exit 1
      - name: Stop container and services
        if: always()
        run: |
          docker compose --project-name academy-wave --file infra/compose.yaml --env-file infra/.env down --volumes --remove-orphans
