name: Academy deployed smoke

# Academy deploys to Hetzner through "Deploy Hetzner Academy", which does not
# create GitHub deployments, so there is no deployment_status to react to.
# Run this by hand after a deploy (or wire it to workflow_run when the Hetzner
# deploy is trusted to gate on it).
on:
  workflow_dispatch:
    inputs:
      url:
        description: Academy base URL to smoke (defaults to the Hetzner box)
        required: false
        default: http://91.99.78.17:4317
        type: string
      revision:
        description: Full deployed source commit SHA
        required: true
        type: string
      sso:
        description: Also probe the facilitator Google login start (fails when SSO is not configured)
        required: false
        default: false
        type: boolean
      public_url:
        description: Public origin the SSO callback must use (defaults to url)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify deployed identity, readiness and authentication
        env:
          SMOKE_BASE_URL: ${{ inputs.url }}
          EXPECTED_REVISION: ${{ inputs.revision }}
          SMOKE_SSO: ${{ inputs.sso && '1' || '' }}
          SMOKE_PUBLIC_URL: ${{ inputs.public_url }}
        run: node scripts/deployed-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: deployed-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/deployed-smoke.json
          if-no-files-found: error
          retention-days: 14
